# Evalyx reference PRODUCTION deployment (Phase 17).
#
# Services: reverse proxy (public) -> api -> postgres/redis (private),
# plus an independent worker and a one-shot migrate job.
#
# Secrets are NEVER in this file. Every credential comes from the
# environment (or a mounted secrets file resolved by the shell into the
# environment). Copy .env.production.example to .env.production, fill it
# in from your secret store, and keep it out of version control.
#
# Usage:
#   docker compose -f docker-compose.production.yml --env-file .env.production build
#   docker compose -f docker-compose.production.yml --env-file .env.production run --rm migrate
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#   curl https://<host>/health/ready
#
# Local development stays on docker-compose.yml (dev defaults, published
# infra ports). This file is production-only: no published DB/Redis ports.

name: evalyx-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Internal only: no `ports:` — reachable via the private network only.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-evalyx}
      # Bounded connections; the app pools through DB_POOL_SIZE.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal only: transient broker/cache — NOT the source of truth.
    # PostgreSQL owns all evaluation state.
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-noeviction}
      - --appendonly ${REDIS_APPENDONLY:-no}
      - --save ${REDIS_SAVE:-""}
    volumes:
      - redis_prod_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # One-shot: `docker compose -f docker-compose.production.yml run --rm
    # migrate`. Never auto-runs from API replicas on startup.
    entrypoint: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    profiles: ["tools"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Reachable only through the reverse proxy (no published port by
    # default; publish explicitly for smoke tests if needed).
    expose:
      - "8000"
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: false
    environment:
      APP_ENV: production
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY must be set}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?CLERK_JWKS_URL must be set}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      EVALYX_SECRET_KEY: ${EVALYX_SECRET_KEY:?EVALYX_SECRET_KEY must be set}
      EVALYX_ENCRYPTION_KEY: ${EVALYX_ENCRYPTION_KEY:?EVALYX_ENCRYPTION_KEY must be set}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_WORKERS: ${API_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_EVAL_PER_MINUTE: ${RATE_LIMIT_EVAL_PER_MINUTE:-20}
      RATE_LIMIT_TEST_PER_MINUTE: ${RATE_LIMIT_TEST_PER_MINUTE:-10}
      MAX_CASES_PER_EVALUATION: ${MAX_CASES_PER_EVALUATION:-500}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - frontend
    deploy:
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-"1.0"}
          memory: ${API_MEMORY_LIMIT:-1G}
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/entrypoint-worker.sh"]
    restart: unless-stopped
    # Internal only: no ports at all. Same image + env as the API; task
    # args carry run ids only, never secrets.
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: false
    environment:
      APP_ENV: production
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY must be set}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?CLERK_JWKS_URL must be set}
      EVALYX_SECRET_KEY: ${EVALYX_SECRET_KEY:?EVALYX_SECRET_KEY must be set}
      EVALYX_ENCRYPTION_KEY: ${EVALYX_ENCRYPTION_KEY:?EVALYX_ENCRYPTION_KEY must be set}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      WORKER_SOFT_TIME_LIMIT_SECONDS: ${WORKER_SOFT_TIME_LIMIT_SECONDS:-3600}
      WORKER_HARD_TIME_LIMIT_SECONDS: ${WORKER_HARD_TIME_LIMIT_SECONDS:-3900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-"2.0"}
          memory: ${WORKER_MEMORY_LIMIT:-2G}
        reservations:
          memory: 512M
    stop_grace_period: 120s
    # Liveness: the Celery process answers `inspect ping` for this worker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A evalyx.worker.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # The ONLY public service. Terminates TLS, redirects HTTP->HTTPS, and
    # forwards to the API with safe headers (see deploy/nginx.conf).
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:-./deploy/tls/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./deploy/tls/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

networks:
  frontend:
  internal:
    internal: true

volumes:
  postgres_prod_data:
  redis_prod_data:
