# Evalyx production reverse proxy (Phase 17).
#
# Portable nginx reference: TLS termination, HTTP->HTTPS redirect, safe
# forwarding, request-size/timeout bounds, API-only security headers.
# The FastAPI port is NEVER exposed to the Internet — only this proxy is.
#
# NOTE: the upstream hostname is resolved once at nginx startup. After
# recreating the `api` container (new IP), reload the proxy:
#   docker compose -f docker-compose.production.yml exec reverse-proxy nginx -s reload
#
# TLS provisioning is operator-managed (certbot, cloud LB, internal CA...):
# place the certificate chain + key at the paths mounted in
# docker-compose.production.yml (TLS_CERT_PATH / TLS_KEY_PATH). Set the
# server_name below to the public hostname (default "_" answers any host;
# replace it when a fixed hostname is required). See docs/deployment.md.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time rid=$http_x_request_id';

    access_log /var/log/nginx/access.log main;

    # Upstream: internal API only (never Postgres/Redis/worker).
    upstream evalyx_api {
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Bounded buffers/timeouts (DoS baseline).
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Hide version signatures.
    server_tokens off;

    # --- HTTP: redirect everything to HTTPS ---
    server {
        listen 80 default_server;
        server_name _; # operator: set the public hostname here
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: the only public entry point ---
    server {
        listen 443 ssl default_server;
        server_name _; # operator: set the public hostname here

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        # HSTS: production TLS only (preload left to the operator's domain policy).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # API-boundary security headers (no browser UI functionality needed).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            # Safe forwarding: real client IP + scheme for logs/rate limits.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://evalyx_api;

            # Fail fast + surface readiness correctly.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_intercept_errors off;
        }

        # Liveness for load balancers: cheap, unauthenticated, no dependencies.
        location = /health {
            proxy_pass http://evalyx_api;
        }
    }
}
