[project]
name = "evalyx"
version = "0.1.0"
description = "An AI evaluation and reliability platform for testing, observing, debugging, and regression-testing LLM applications and agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [

    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
# Unit tests live in tests/. test_openrouter.py at the repo root is a
# standalone connectivity script, not a pytest module — keep it out of
# test collection.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires live PostgreSQL/Redis (set EVALYX_RUN_INTEGRATION_TESTS=1)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalyx"]
